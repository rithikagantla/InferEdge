server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the FastAPI container, stripping the /api prefix
    # (mirrors the Vite dev-server proxy).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 1800s;  # benchmark runs can take a while
    }
}
