services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      INFERENCE_MODE: ${INFERENCE_MODE:-mock}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_NIM_SMALL_MODEL: ${NVIDIA_NIM_SMALL_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
    volumes:
      - inferedge-data:/srv/inferedge/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inferedge-data:
